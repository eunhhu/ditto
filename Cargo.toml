[workspace]
members = [
  "apps/cli",
  "apps/daemon",
  "crates/artifact-store",
  "crates/capability-index",
  "crates/capability-runtime",
  "crates/context-compiler",
  "crates/context-graph",
  "crates/effect-policy",
  "crates/event-store",
  "crates/executor",
  "crates/kernel",
  "crates/model-driver",
  "crates/protocol",
  "crates/scheduler",
  "crates/task-state",
  "sdk/rust",
]
default-members = ["apps/cli", "apps/daemon"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/eunhhu/ditto"

[workspace.dependencies]
ditto-artifact-store = { path = "crates/artifact-store" }
ditto-capability-index = { path = "crates/capability-index" }
ditto-capability-runtime = { path = "crates/capability-runtime" }
ditto-context-compiler = { path = "crates/context-compiler" }
ditto-context-graph = { path = "crates/context-graph" }
ditto-effect-policy = { path = "crates/effect-policy" }
ditto-event-store = { path = "crates/event-store" }
ditto-executor = { path = "crates/executor" }
ditto-kernel = { path = "crates/kernel" }
ditto-model-driver = { path = "crates/model-driver" }
ditto-protocol = { path = "crates/protocol" }
ditto-scheduler = { path = "crates/scheduler" }
ditto-task-state = { path = "crates/task-state" }
ditto-sdk = { path = "sdk/rust" }

anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.1", features = ["derive"] }
futures = "0.3.34"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

