id = "web.fetch"
version = "0.1.0"
namespace = "web"
kind = "tool"
summary = "Read the text of a web page whose link the user sent in this message."

[runtime]
type = "builtin"
lazy = true
idle_ttl_ms = 0

[placement]
modes = ["local"]
requires = []

[retrieval]
intents = ["read a web page the user linked", "summarize a linked article"]
negative_examples = ["search the web", "submit a form or post to a website"]
aliases = ["open link", "read url"]
complements = []

[effects]
resources = ["url:{url}"]

[effects.minimum]
access = "content"
mutation = "none"
externality = "network"
privilege = "user"

[effects.maximum]
access = "content"
mutation = "none"
externality = "network"
privilege = "user"

[policy]
approval = "explicit-command"
secret_handles = []
