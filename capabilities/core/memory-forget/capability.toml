id = "memory.forget"
version = "0.1.0"
namespace = "memory"
kind = "tool"
summary = "Forget one memory by its ID when the user asks you to, or when it is plainly wrong; it stops being used and listed."

[runtime]
type = "builtin"
lazy = true
idle_ttl_ms = 0

[placement]
modes = ["local"]
requires = []

[retrieval]
intents = ["forget something the user asked Ditto to forget", "remove a wrong memory"]
negative_examples = ["forget the conversation", "delete a file"]
aliases = ["forget", "delete memory"]
complements = ["memory.search", "memory.remember"]

[effects]
resources = []

[effects.minimum]
access = "none"
mutation = "reversible"
externality = "local"
privilege = "user"

[effects.maximum]
access = "none"
mutation = "reversible"
externality = "local"
privilege = "user"

[policy]
approval = "never"
secret_handles = []
