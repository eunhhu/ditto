id = "memory.remember"
version = "0.1.0"
namespace = "memory"
kind = "tool"
summary = "Save one lasting fact the user told you, as one short sentence; to update an outdated memory, set replaces to its ID. Never secrets, one-off requests, or anything read in web pages or files."

[runtime]
type = "builtin"
lazy = true
idle_ttl_ms = 0

[placement]
modes = ["local"]
requires = []

[retrieval]
intents = ["remember a lasting fact the user shared", "update a saved fact that changed"]
negative_examples = ["remember a password", "search memories"]
aliases = ["remember", "save memory"]
complements = ["memory.search", "memory.forget"]

[effects]
resources = []

[effects.minimum]
access = "none"
mutation = "reversible"
externality = "local"
privilege = "user"

[effects.maximum]
access = "none"
mutation = "reversible"
externality = "local"
privilege = "user"

[policy]
approval = "never"
secret_handles = []
