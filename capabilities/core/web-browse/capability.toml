id = "web.browse"
version = "0.1.0"
namespace = "web"
kind = "tool"
summary = "Search the web through the operator's search service, or read a web page whose link the user sent."

[runtime]
type = "builtin"
lazy = true
idle_ttl_ms = 0

[placement]
modes = ["local"]
requires = []

[retrieval]
intents = ["search the web", "look up current information online", "read a web page the user linked"]
negative_examples = ["search memories", "submit a form or post to a website"]
aliases = ["web search", "look it up", "open link"]
complements = []

[effects]
resources = ["url:{url}"]

[effects.minimum]
access = "content"
mutation = "none"
externality = "network"
privilege = "user"

[effects.maximum]
access = "content"
mutation = "none"
externality = "network"
privilege = "user"

[policy]
approval = "never"
secret_handles = []
