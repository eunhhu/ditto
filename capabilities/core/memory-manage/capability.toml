id = "memory.manage"
version = "0.1.0"
namespace = "memory"
kind = "tool"
summary = "Keep the user's memories current: search them, remember a lasting fact (replacing an outdated one), or forget one."

[runtime]
type = "builtin"
lazy = true
idle_ttl_ms = 0

[placement]
modes = ["local"]
requires = []

[retrieval]
intents = ["recall something the user asked Ditto to remember", "remember a lasting fact the user shared", "forget a memory"]
negative_examples = ["remember a password", "search the web"]
aliases = ["recall", "remember", "forget"]
complements = []

[effects]
resources = []

[effects.minimum]
access = "none"
mutation = "none"
externality = "local"
privilege = "user"

[effects.maximum]
access = "content"
mutation = "reversible"
externality = "local"
privilege = "user"

[policy]
approval = "never"
secret_handles = []
