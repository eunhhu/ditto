id = "skill.read"
version = "0.1.0"
namespace = "skill"
kind = "tool"
summary = "Read one of this profile's skills by name: the body of a SKILL.md whose header was in the catalogue."

[runtime]
type = "builtin"
lazy = true
idle_ttl_ms = 0

[placement]
modes = ["local"]
requires = []

[retrieval]
intents = ["follow a procedure this installation knows", "read the steps of a named skill"]
negative_examples = ["remember a fact", "search the web"]
aliases = ["open skill", "read skill"]
complements = []

[effects]
resources = []

[effects.minimum]
access = "content"
mutation = "none"
externality = "local"
privilege = "user"

[effects.maximum]
access = "content"
mutation = "none"
externality = "local"
privilege = "user"

[policy]
approval = "never"
secret_handles = []

[verification]
default = "content-hash"
